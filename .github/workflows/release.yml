name: Release

# Publishes every package at the version in its package.json when a `v*` tag is
# pushed. The whole family releases together on ONE version (like pond-ts).
# Needs the `NPM_TOKEN` repository secret (an npm automation token for the
# @tidal-ts scope).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag names the version every package carries, and sits on main
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag" >&2; exit 1; }
          done
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main" >&2; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
