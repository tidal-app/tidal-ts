name: Release

# Publishes every package at the version in its package.json when a `v*` tag is
# pushed. The whole family releases together on ONE version (like pond-ts).
#
# Credentials: none stored. Publishing uses npm's **trusted publishing** (OIDC):
# each package on npmjs.com names this repo + this workflow as its trusted
# publisher, and npm mints a short-lived token per run. That link can only be
# made on a package that already EXISTS, so a brand-new package's first version
# is published by hand — see RELEASING.md. A version already on the registry is
# skipped rather than failed, so the tag for a hand-published version can still
# be pushed for the record.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag names the version every package carries, and sits on main
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag" >&2; exit 1; }
          done
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main" >&2; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      # The npm CLI is the reference client for trusted publishing; pnpm 11's own
      # OIDC exchange was refused by the registry ("OIDC permission denied for this
      # action") against a trusted-publisher entry that matched to the letter
      # (2026-09-16, v0.1.1's first run). So: pnpm PACKS (it rewrites `workspace:*`
      # to the concrete version, which `npm pack` would not), npm PUBLISHES.
      - run: npm install --global npm@11
      - name: Publish what the registry does not have yet (dependency order)
        # No `registry-url` on setup-node and an explicitly EMPTY NODE_AUTH_TOKEN:
        # setup-node's registry-url writes an `_authToken=${NODE_AUTH_TOKEN}`
        # line into .npmrc and fills the variable with a placeholder, and that
        # bogus credential pre-empts the OIDC exchange (github.com/orgs/community
        # /discussions/176761). The registry default is npmjs.org anyway.
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          out="$RUNNER_TEMP/tarballs"; mkdir -p "$out"
          for pkg in core chart terminal; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry — skipping"
              continue
            fi
            tarball=$(pnpm --filter "$name" pack --pack-destination "$out" | tail -1)
            npm publish "$tarball" --access public --provenance
          done
